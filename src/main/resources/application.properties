spring.application.name=springai_mcp_client_mysql

# Provide API key through environment variable OPENAI_API_KEY.
spring.ai.openai.base-url=http://localhost:1234/v1
spring.ai.openai.api-key=${LM_API_TOKEN:lm-studio}
spring.ai.openai.chat.options.model=qwen/qwen3-8b

# MCP client reads stdio servers from mcp-servers.json.
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers.json
spring.ai.mcp.client.toolcallback.enabled=true